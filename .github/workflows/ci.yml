name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gemini-candlestick .

      - name: Check that the app imports
        run: docker run --rm gemini-candlestick python -c "import main, geminicandlestick"
