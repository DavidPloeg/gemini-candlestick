services:
  gemini-candlestick:
    image: gemini_candlestick
    restart: always
    build:
      context: .
      dockerfile: "./Dockerfile.custom"
    # API keys and IDs are read from .env (copy .env.example to .env)
    env_file: .env
    container_name: gemini-candlestick
    # Keep generated reports and charts on the host in ./data
    volumes:
      - ./data:/opt/app/data
